name: Update videos

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - name: Save the new catalog
        run: |
          git config user.name "streamfans-bot"
          git config user.email "streamfans-bot@users.noreply.github.com"
          git add catalog.json data/resolved.json
          git diff --cached --quiet && exit 0
          git commit -m "Update video catalog"
          git pull --rebase origin main
          git push origin main
